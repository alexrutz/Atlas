# =============================================================================
# Atlas RAG System - Docker Compose
# =============================================================================
# Starts all required services for the Atlas RAG system.
# Usage: docker compose up -d
#
# Services start strictly sequentially via depends_on + service_healthy chain
# (postgres -> llama-llm -> llama-embed -> llama-rerank -> docling-serve ->
# backend -> frontend / llm-diagnostic) so startup logs do not interleave.
# =============================================================================

services:
  # ---------------------------------------------------------------------------
  # PostgreSQL with pgvector extension
  # ---------------------------------------------------------------------------
  postgres:
    image: pgvector/pgvector:pg16
    container_name: atlas-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: atlas
      POSTGRES_USER: atlas_user
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set}
    ports:
      - "5432:5432"
    volumes:
      - ../postgres_data:/var/lib/postgresql/data
      - ./scripts/init-db.sql:/docker-entrypoint-initdb.d/01-init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U atlas_user -d atlas"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - atlas-network

  # ---------------------------------------------------------------------------
  # llama-server - LLM Server (OpenAI-compatible API, CUDA GPU)
  # Model: unsloth/Qwen3.6-35B-A3B-GGUF (Q5_K_XL, ~26.6 GB)
  # --jinja enables Jinja2 chat templates so thinking can be controlled
  # at runtime via the model's built-in template (enable_thinking parameter).
  # --reasoning-format auto detects the model's thinking tag style.
  # --reasoning-budget controls max thinking tokens (-1 = unlimited).
  # ---------------------------------------------------------------------------
  llama-llm:
    image: ghcr.io/ggml-org/llama.cpp:server-cuda
    container_name: atlas-llama-llm
    restart: unless-stopped
    user: root
    ports:
      - "8080:8080"
    environment:
      - HF_HOME=/models
      - HF_TOKEN=${HF_TOKEN:-}
    volumes:
      - ../models:/models
    command: >
      -m /models/${LLM_MODEL_FILE:-Qwen3.6-35B-A3B-UD-Q5_K_XL.gguf}
      --port 8080
      --host 0.0.0.0
      --ctx-size 65536
      --alias llm
      -ctk q8_0
      -ctv q8_0
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 180s
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - atlas-network

  # ---------------------------------------------------------------------------
  # llama-embed - Embedding Server (OpenAI-compatible API, CUDA GPU)
  # Model: Qwen/Qwen3-Embedding-4B-GGUF (Q6_K, ~3.31 GB, 2560-dim output)
  # OpenAI-compatible /v1/embeddings endpoint on port 8081.
  # ---------------------------------------------------------------------------
  llama-embed:
    image: ghcr.io/ggml-org/llama.cpp:server-cuda
    container_name: atlas-llama-embed
    restart: unless-stopped
    user: root
    ports:
      - "8081:8081"
    volumes:
      - ../models:/models
    command: >
      -m /models/${EMBED_MODEL_FILE:-Qwen3-Embedding-4B-Q6_K.gguf}
      --port 8081
      --host 0.0.0.0
      --n-gpu-layers 0
      --ctx-size 32768
      --batch-size ${EMBED_BATCH_SIZE:-1024}
      --ubatch-size ${EMBED_BATCH_SIZE:-1024}
      --alias embed
      --embedding
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081/health"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 300s
    depends_on:
      llama-llm:
        condition: service_healthy
    networks:
      - atlas-network

  # ---------------------------------------------------------------------------
  # llama-rerank - Reranker Server (llama.cpp --reranking mode, CUDA GPU)
  # Model: Voodisss/Qwen3-Reranker-4B-GGUF-llama_cpp (Q6_K, ~3.31 GB)
  # GGUF prepared by the community for llama.cpp's --reranking flag.
  # Endpoint: POST /v1/rerank  body: {"query": "...", "documents": ["..."]}
  # ---------------------------------------------------------------------------
  llama-rerank:
    image: ghcr.io/ggml-org/llama.cpp:server-cuda
    container_name: atlas-llama-rerank
    restart: unless-stopped
    user: root
    ports:
      - "8082:8082"
    volumes:
      - ../models:/models
    command: >
      -m /models/${RERANK_MODEL_FILE:-Qwen3-Reranker-4B-Q6_K.gguf}
      --port 8082
      --host 0.0.0.0
      --n-gpu-layers 0
      --ctx-size 32768
      --alias rerank
      --reranking
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8082/health"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 180s
    depends_on:
      llama-embed:
        condition: service_healthy
    networks:
      - atlas-network

  # ---------------------------------------------------------------------------
  # Docling Serve (official pre-built image for document parsing & chunking)
  # ML-powered layout analysis, table structure recognition, HybridChunker.
  # Supports: PDF, DOCX, XLSX, PPTX, HTML, XML, CSV, MD, images
  # API docs available at http://localhost:5001/docs
  # ---------------------------------------------------------------------------
  docling-serve:
    image: ghcr.io/docling-project/docling-serve:main
    container_name: atlas-docling-serve
    restart: unless-stopped
    ports:
      - "5001:5001"
    environment:
      # OCR
      - DOCLING_SERVE_OCRENABLE=${DOCLING_DO_OCR:-true}
      - DOCLING_SERVE_OCR_ENGINE=${DOCLING_OCR_ENGINE:-rapidocr}
      # Batch sizes
      - DOCLING_SERVE_OCR_BATCH_SIZE=${DOCLING_OCR_BATCH_SIZE:-4}
      - DOCLING_SERVE_LAYOUT_BATCH_SIZE=${DOCLING_LAYOUT_BATCH_SIZE:-4}
      - DOCLING_SERVE_TABLE_BATCH_SIZE=${DOCLING_TABLE_BATCH_SIZE:-4}
      # Timeouts
      - DOCLING_SERVE_DOCUMENT_TIMEOUT=${DOCLING_DOCUMENT_TIMEOUT:-600}
      - DOCLING_SERVE_MAX_SYNC_WAIT=${DOCLING_MAX_SYNC_WAIT:-600}
      # Workers & threading
      - DOCLING_SERVE_ENG_LOC_NUM_WORKERS=${DOCLING_WORKERS:-2}
      - DOCLING_SERVE_ENG_LOC_SHARE_MODELS=${DOCLING_SHARE_MODELS:-true}
      - DOCLING_NUM_THREADS=${DOCLING_NUM_THREADS:-4}
      # Model loading & acceleration
      - DOCLING_SERVE_LOAD_MODELS_AT_BOOT=${DOCLING_WARMUP:-true}
      - DOCLING_ACCELERATOR_DEVICE=${DOCLING_ACCELERATOR_DEVICE:-gpu}
      - DOCLING_FLASH_ATTENTION=${DOCLING_FLASH_ATTENTION:-true}
      # Logging
      - DOCLING_SERVE_LOG_LEVEL=${DOCLING_LOG_LEVEL:-info}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5001/health"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 180s
    depends_on:
      llama-rerank:
        condition: service_healthy
    networks:
      - atlas-network

  # ---------------------------------------------------------------------------
  # Atlas Backend (FastAPI)
  # ---------------------------------------------------------------------------
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: atlas-backend
    restart: unless-stopped
    environment:
      DB_PASSWORD: ${DB_PASSWORD}
      AUTH_SECRET_KEY: ${AUTH_SECRET_KEY:?AUTH_SECRET_KEY must be set}
      ADMIN_DEFAULT_PASSWORD: ${ADMIN_DEFAULT_PASSWORD:-admin}
      # Docling per-request conversion defaults (read by backend, sent in API calls)
      DOCLING_DO_OCR: ${DOCLING_DO_OCR:-true}
      DOCLING_DO_TABLE_STRUCTURE: ${DOCLING_DO_TABLE_STRUCTURE:-true}
      DOCLING_TABLE_MODE: ${DOCLING_TABLE_MODE:-fast}
      DOCLING_DO_CODE_ENRICHMENT: ${DOCLING_DO_CODE_ENRICHMENT:-true}
      DOCLING_OCR_LANG: ${DOCLING_OCR_LANG:-}
      DOCLING_IMAGES_SCALE: ${DOCLING_IMAGES_SCALE:-2.0}
    ports:
      - "8000:8000"
    volumes:
      - ./config.yaml:/app/config.yaml:ro
      - upload_data:/tmp/atlas_uploads
      - ./logs:/app/logs
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      docling-serve:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/api/health', timeout=3).status==200 else 1)"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - atlas-network

  # ---------------------------------------------------------------------------
  # LLM Diagnostic Viewer (tails diagnostic log with colored output)
  # ---------------------------------------------------------------------------
  llm-diagnostic:
    image: alpine:3.20
    container_name: atlas-llm-diagnostic
    restart: unless-stopped
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        echo "Waiting for diagnostic log file..."
        while [ ! -f /logs/llm_diagnostic.log ]; do sleep 1; done
        echo "Tailing LLM diagnostic log..."
        tail -f /logs/llm_diagnostic.log
    volumes:
      - ./logs:/logs:ro
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - atlas-network

  # ---------------------------------------------------------------------------
  # Atlas Frontend (React)
  # ---------------------------------------------------------------------------
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: atlas-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - atlas-network

volumes:
  upload_data:

networks:
  atlas-network:
    driver: bridge
